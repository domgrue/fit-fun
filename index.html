<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Fit+Fun Notenrechner</title>

<!-- iOS App Name -->
<meta name="apple-mobile-web-app-title" content="Fit+Fun">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* --- DESIGN --- */
:root{
  --p:#d62828;
  --pd:#a61e1e;
  --bg:#f7f7f7;
  --card:#ffffff;
  --text:#222;
  --error:#b00020;
  --ok:#2e7d32;
  --warn:#f9a825;
  --r:14px;
  --sh:0 4px 12px rgba(0,0,0,0.08);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root{
    --bg:#1e1e1e;
    --card:#2a2a2a;
    --text:#f2f2f2;
    --sh:0 4px 12px rgba(0,0,0,0.5);
  }
}

body{
  margin:0;
  padding:1rem;
  background:var(--bg);
  color:var(--text);
  max-width:650px;
  margin-inline:auto;
}

.card{
  background:var(--card);
  padding:1.2rem;
  border-radius:var(--r);
  box-shadow:var(--sh);
  margin-bottom:1.2rem;
}

h1{
  margin:0 0 .5rem 0;
  font-size:1.6rem;
  font-weight:700;
}

button{
  background:var(--p);
  color:#fff;
  border:none;
  padding:.7rem 1rem;
  font-size:1rem;
  border-radius:var(--r);
  cursor:pointer;
  margin-top:.5rem;
  width:100%;
  transition:0.15s;
}
button:hover{ background:var(--pd); }

.btn-small{
  width:auto;
  padding:.45rem .9rem;
  font-size:.9rem;
  margin-bottom:1rem;
}

.btn-row{
  display:flex;
  gap:.7rem;
  justify-content:center;
  margin-top:1rem;
}

select,
input[type=number]{
  width:100%;
  padding:.55rem;
  font-size:1rem;
  border-radius:var(--r);
  border:2px solid #ccc;
  margin-top:.35rem;
  box-sizing:border-box;
  max-width:100%;
  transition:0.2s;
}

legend{
  font-weight:600;
  margin-bottom:.3rem;
}

.output{
  font-size:1.3rem;
  font-weight:700;
  padding:.8rem;
  border-radius:var(--r);
  background:#ffe5e5;
  color:var(--pd);
  margin-top:.7rem;
  text-align:center;
}

.error{
  color:var(--error);
  font-weight:600;
  margin-top:.25rem;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:1rem;
  background:var(--card);
  border-radius:var(--r);
  overflow:hidden;
  box-shadow:var(--sh);
}
th{
  background:var(--p);
  color:#fff;
  padding:.6rem;
  text-align:left;
}
tr:nth-child(even){ background:#ffeaea; }
td{
  padding:.6rem;
  border-bottom:1px solid #e0e0e0;
}

.row{
  display:flex;
  flex-direction:column;
  gap:.5rem;
}
</style>
</head>

<body>

<!-- STARTSCREEN -->
<div id="startscreen">
  <div class="card">
    <h1>Fit+Fun Notenrechner</h1>
    <p>Wähle deine Kategorie:</p>
    <div class="btn-row">
      <button onclick="start('damen')">Damen</button>
      <button onclick="start('herren')">Herren</button>
      <button onclick="start('mixed')">Mixed</button>
    </div>
  </div>
</div>

<!-- RECHNER -->
<div id="rechner" style="display:none;">
  <button class="btn-small" onclick="back()">Kategorie wechseln</button>

  <div class="card">
    <h1>Fit+Fun Notenrechner</h1>
    <p>Formeln gemäss Wertungstabelle Fit+Fun 2026 (ohne Gewähr).</p>
  </div>

  <div class="card">
    <form onsubmit="event.preventDefault();">

      <fieldset>
        <legend>Disziplin</legend>
        <select id="disziplin">
          <option value="1a">FF1 – Aufgabe 1a: Fussball‑Staffetenstab</option>
          <option value="1b">FF1 – Aufgabe 1b: Reif – Bälle</option>
          <option value="2a">FF2 – Aufgabe 2a: Brettball – Moosgummiring</option>
          <option value="2b">FF2 – Aufgabe 2b: 8er‑Ball</option>
          <option value="3a">FF3 – Aufgabe 3a: Street Racket</option>
          <option value="3b">FF3 – Aufgabe 3b: Moosgummi‑Intercross</option>
        </select>
      </fieldset>

      <div id="mixedBox" style="display:none;">
        <fieldset>
          <legend>Mixed (Anzahl Personen)</legend>
          <div class="row">
            <div>
              <label>Turnerinnen</label>
              <input id="f" type="number" min="0">
            </div>
            <div>
              <label>Turner</label>
              <input id="m" type="number" min="0">
            </div>
          </div>
          <div id="err" class="error"></div>
        </fieldset>
      </div>

      <fieldset>
        <legend>Punkte</legend>
        <input id="punkte" type="number" step="0.1">
      </fieldset>

      <button type="button" onclick="resetInputs()">Eingaben löschen</button>

      <div id="out" class="output">Note: –</div>

      <button type="button" id="toggle" onclick="toggleTable()">Punkte‑Tabelle einblenden</button>
      <div id="table" style="display:none;"></div>

    </form>
  </div>
</div>

<script>
let kat=null,tableVisible=false;

/* --- FORMELN & GRENZEN --- */
const MIN={ "1a":4,"1b":6,"2a":5,"2b":6,"3a":6,"3b":6 };
const MAX={ "1a":4,"1b":6,"2a":5,"2b":6,"3a":4,"3b":4 };

const FORM={
 "1a":{d:d=>(d-10)/7.1,h:d=>(d-9)/8.9,m:(d,F,M)=>((F*(d-10)/7.1)+(M*(d-9)/8.9))/(F+M)},
 "1b":{d:d=>(d+21)/18.4,h:d=>(d+38)/23,m:(d,F,M)=>((F*(d+21)/18.4)+(M*(d+38)/23))/(F+M)},
 "2a":{d:d=>(d-55)/13.4,h:d=>(d-42)/18.8,m:(d,F,M)=>((F*(d-55)/13.4)+(M*(d-42)/18.8))/(F+M)},
 "2b":{d:d=>(d+1)/14.6,h:d=>(d+28)/21,m:(d,F,M)=>((F*(d+1)/14.6)+(M*(d+28)/21))/(F+M)},
 "3a":{d:d=>(d-47)/11.6,h:d=>(d-37)/16.1,m:(d,F,M)=>((F*(d-47)/11.6)+(M*(d-37)/16.1))/(F+M)},
 "3b":{d:d=>(d-34)/9.7,h:d=>(d-31)/12.2,m:(d,F,M)=>((F*(d-34)/9.7)+(M*(d-31)/12.2))/(F+M)}
};

/* --- RESET --- */
function resetInputs(){
 document.getElementById("punkte").value="";
 document.getElementById("f").value="";
 document.getElementById("m").value="";
 document.getElementById("err").textContent="";
 document.getElementById("out").textContent="Note: –";
 document.getElementById("table").innerHTML="";
 document.getElementById("table").style.display="none";
 tableVisible=false;
 document.getElementById("toggle").textContent="Punkte‑Tabelle einblenden";
 validateMixed();
}

/* --- START / BACK --- */
function start(k){
 kat=k;
 document.getElementById("startscreen").style.display="none";
 document.getElementById("rechner").style.display="block";
 resetInputs();
 document.getElementById("disziplin").value="1a";
 document.getElementById("mixedBox").style.display=(k==="mixed")?"block":"none";
}

function back(){
 document.getElementById("rechner").style.display="none";
 document.getElementById("startscreen").style.display="block";
 resetInputs();
 kat=null;
}

/* --- TOGGLE TABLE --- */
function toggleTable(){
 tableVisible=!tableVisible;
 const t=document.getElementById("table");
 const b=document.getElementById("toggle");
 if(tableVisible){ t.style.display="block"; b.textContent="Punkte‑Tabelle ausblenden"; genTable(); }
 else{ t.style.display="none"; b.textContent="Punkte‑Tabelle einblenden"; }
}

/* --- LIVE VALIDIERUNG MIXED --- */
function validateMixed(){
 if(kat!=="mixed") return;

 const F=document.getElementById("f");
 const M=document.getElementById("m");
 const err=document.getElementById("err");
 const dis=document.getElementById("disziplin").value;

 let f=F.value===""?null:parseInt(F.value);
 let m=M.value===""?null:parseInt(M.value);

 F.style.borderColor="#ccc";
 M.style.borderColor="#ccc";
 err.textContent="";

 if(f===null && m===null) return;

 if(f===null) f=0;
 if(m===null) m=0;

 const total=f+m;

 if(total>MAX[dis]){
   err.textContent=`Maximal ${MAX[dis]} Personen`;
   F.style.borderColor="var(--error)";
   M.style.borderColor="var(--error)";
   return;
 }

 if(total<MIN[dis]){
   err.textContent=`Mindestens ${MIN[dis]} Personen erfassen`;
   F.style.borderColor="var(--warn)";
   M.style.borderColor="var(--warn)";
   return;
 }

 F.style.borderColor="var(--ok)";
 M.style.borderColor="var(--ok)";
 err.textContent="";
}

/* --- LIVE NOTE (mit Max/Min) --- */
document.getElementById("punkte").addEventListener("input",()=>calc());
document.getElementById("f").addEventListener("input",()=>{ validateMixed(); if(tableVisible) genTable(); });
document.getElementById("m").addEventListener("input",()=>{ validateMixed(); if(tableVisible) genTable(); });
document.getElementById("disziplin").addEventListener("change",()=>{ resetInputs(); });

function calc(){
 const dis=document.getElementById("disziplin").value;
 const d=parseFloat(document.getElementById("punkte").value);
 const out=document.getElementById("out");

 if(isNaN(d)){ out.textContent="Note: –"; return; }

 let n;

 if(kat==="mixed"){
   let F=document.getElementById("f").value;
   let M=document.getElementById("m").value;

   if(F==="") F=0;
   if(M==="") M=0;

   F=parseInt(F); M=parseInt(M);
   const total=F+M;

   if(total<MIN[dis] || total>MAX[dis]){ out.textContent="Note: –"; return; }

   n=FORM[dis].m(d,F,M);
 } else {
   n = (kat==="damen") ? FORM[dis].d(d) : FORM[dis].h(d);
 }

 if(n > 10) out.textContent="Note: 10.00 (Maximalnote)";
 else if(n < 3) out.textContent="Note: 3.00 (Minimalnote)";
 else out.textContent=`Note: ${n.toFixed(2)}`;
}

/* --- PUNKTE-TABELLE (robust & korrekt) --- */
function genTable(){
 const dis=document.getElementById("disziplin").value;
 const t=document.getElementById("table");

 let F=document.getElementById("f").value;
 let M=document.getElementById("m").value;

 if(kat==="mixed" && F==="" && M===""){
   t.innerHTML = `<div class='error'>Bitte Anzahl Personen eingeben</div>`;
   return;
 }

 F = (F === "") ? 0 : parseInt(F);
 M = (M === "") ? 0 : parseInt(M);

 const total = F + M;

 if(kat==="mixed"){
   if(total < MIN[dis]){
     t.innerHTML = `<div class='error'>Mindestens ${MIN[dis]} Personen erfassen</div>`;
     return;
   }
   if(total > MAX[dis]){
     t.innerHTML = `<div class='error'>Maximal ${MAX[dis]} Personen</div>`;
     return;
   }
 }

 let html="<table><tr><th>Punkte</th><th>Note</th></tr>";

 /* --- 1) ALLE NOTES VORBERECHNEN --- */
 let arr = [];

 for(let p=0; p<=300; p++){
   let rawN;

   if(kat==="damen") rawN = FORM[dis].d(p);
   else if(kat==="herren") rawN = FORM[dis].h(p);
   else rawN = FORM[dis].m(p,F,M);

   arr.push({p:p, raw:rawN});
 }

 /* --- 2) STARTPUNKT FINDEN: erster raw >= 10 --- */
 let startIndex = arr.findIndex(e => e.raw >= 10);

 if(startIndex === -1){
   t.innerHTML = "<div class='error'>Keine gültigen Werte gefunden</div>";
   return;
 }

 let startP = arr[startIndex].p;

 /* --- 3) TABELLE VON startP NACH UNTEN BIS 3.00 --- */
 for(let x = startP; x >= 0; x--){
   let rawN = arr[x].raw;

   if(rawN < 0) break;

   let n = rawN;
   if(n > 10) n = 10;
   if(n < 3) n = 3;

   html += `<tr><td>${x}</td><td>${n.toFixed(2)}</td></tr>`;

   if(n === 3) break;
 }

 html+="</table>";
 t.innerHTML=html;
}
</script>

</body>
</html>
