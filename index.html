<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Fit+Fun Notenrechner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0066cc">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --primary: #0066cc;
      --primary-dark: #004c99;
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --radius: 14px;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      max-width: 650px;
      margin-inline: auto;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .card {
      background: var(--card-bg);
      padding: 1.4rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1.4rem;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.2rem;
      font-size: 1rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: 0.15s;
      width: 100%;
      margin-top: 0.5rem;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .btn-small {
      width: auto;
      padding: 0.55rem 1rem;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .btn-row {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      margin-top: 1.2rem;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border-radius: var(--radius);
      border: 1px solid #ccc;
      margin-top: 0.4rem;
    }

    fieldset {
      border: none;
      padding: 0;
      margin: 0 0 1.2rem 0;
    }

    legend {
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .output {
      font-size: 1.3rem;
      font-weight: 700;
      padding: 0.9rem 1rem;
      border-radius: var(--radius);
      background: #e9f2ff;
      margin-top: 0.8rem;
      text-align: center;
    }

    .error {
      color: #b00020;
      font-weight: 600;
      margin-top: 0.3rem;
    }

    /* Optimierte Tabelle */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    th {
      background: var(--primary);
      color: white;
      padding: 0.7rem;
      text-align: left;
      font-size: 1rem;
    }

    tr:nth-child(even) {
      background: #f0f6ff;
    }

    tr:nth-child(odd) {
      background: #ffffff;
    }

    td {
      padding: 0.7rem;
      border-bottom: 1px solid #e0e7f1;
      font-size: 1rem;
    }

    #startscreen {
      margin-top: 3rem;
      text-align: center;
    }

    #backBtn {
      background: #444;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- STARTSCREEN -->
  <div id="startscreen">
    <div class="card">
      <h1>Fit+Fun Notenrechner</h1>
      <p>Wähle deine Kategorie, um den passenden Rechner zu laden.</p>

      <div class="btn-row">
        <button onclick="startWithCategory('damen')">Damen</button>
        <button onclick="startWithCategory('herren')">Herren</button>
        <button onclick="startWithCategory('mixed')">Mixed</button>
      </div>
    </div>
  </div>

  <!-- RECHNER -->
  <div id="rechner" style="display:none;">

    <button id="backBtn" class="btn-small" onclick="goBack()">Kategorie wechseln</button>

    <div class="card">
      <h1>Fit+Fun Notenrechner</h1>
      <p>Formeln gemäss Wertungstabelle Fit+Fun 2026 (ohne Gewähr).</p>
    </div>

    <div class="card">
      <form id="notenForm" onsubmit="event.preventDefault(); berechneNote();">

        <fieldset>
          <legend>Disziplin</legend>
          <select id="disziplin" required>
            <option value="1a">FF1 – Aufgabe 1a: Fussball-Staffetenstab</option>
            <option value="1b">FF1 – Aufgabe 1b: Reif – Bälle</option>
            <option value="2a">FF2 – Aufgabe 2a: Brettball – Moosgummiring</option>
            <option value="2b">FF2 – Aufgabe 2b: 8er-Ball</option>
            <option value="3a">FF3 – Aufgabe 3a: Street Racket</option>
            <option value="3b">FF3 – Aufgabe 3b: Moosgummi-Intercross</option>
          </select>
        </fieldset>

        <!-- Mixed Inputs -->
        <div id="mixedInputs" style="display:none;">
          <fieldset>
            <legend>Mixed (Anzahl Personen erfassen)</legend>
            <div class="row">
              <div>
                <label for="anzTi">Turnerinnen</label>
                <input type="number" id="anzTi" min="0" step="1" />
              </div>
              <div>
                <label for="anzTu">Turner</label>
                <input type="number" id="anzTu" min="0" step="1" />
              </div>
            </div>
            <div id="errorMsg" class="error"></div>
          </fieldset>
        </div>

        <fieldset>
          <legend>Punkte</legend>
          <input type="number" id="punkte" step="0.1" required />
        </fieldset>

        <button type="submit">Note berechnen</button>

        <div id="output" class="output" aria-live="polite">
          Note: –
        </div>

        <!-- Toggle Button -->
        <button type="button" id="toggleTableBtn" onclick="toggleTable()">Punkte‑Tabelle einblenden</button>

        <div id="tableContainer" style="display:none;"></div>

      </form>
    </div>
  </div>

  <script>
    let aktiveKategorie = null;
    let tableVisible = false;

    /* Mindestpersonen pro Disziplin */
    const MIN_TEILNEHMER = {
      "1a": 4,
      "1b": 6,
      "2a": 5,
      "2b": 6,
      "3a": 6,
      "3b": 6
    };

    function resetAll() {
      document.getElementById("punkte").value = "";
      document.getElementById("output").textContent = "Note: –";
      document.getElementById("errorMsg").textContent = "";
      document.getElementById("anzTi").value = "";
      document.getElementById("anzTu").value = "";
      document.getElementById("tableContainer").innerHTML = "";
      document.getElementById("tableContainer").style.display = "none";
      tableVisible = false;
      document.getElementById("toggleTableBtn").textContent = "Punkte‑Tabelle einblenden";
    }

    function startWithCategory(k) {
      aktiveKategorie = k;

      document.getElementById("startscreen").style.display = "none";
      document.getElementById("rechner").style.display = "block";

      resetAll();

      document.getElementById("disziplin").value = "1a";
      mixedInputs.style.display = (k === "mixed") ? "block" : "none";

      generiereTabelle();
    }

    function goBack() {
      document.getElementById("rechner").style.display = "none";
      document.getElementById("startscreen").style.display = "block";
      resetAll();
    }

    function toggleTable() {
      tableVisible = !tableVisible;

      const container = document.getElementById("tableContainer");
      const btn = document.getElementById("toggleTableBtn");

      if (tableVisible) {
        container.style.display = "block";
        btn.textContent = "Punkte‑Tabelle ausblenden";
      } else {
        container.style.display = "none";
        btn.textContent = "Punkte‑Tabelle einblenden";
      }
    }

    /* --- Logik --- */

    const MAX_TEILNEHMER = {
      "1a": 4,
      "1b": 6,
      "2a": 5,
      "2b": 6,
      "3a": 4,
      "3b": 4
    };

    const PUNKTEBEREICHE = {
      "1a": { damen: [46, 81], herren: [54, 98] },
      "1b": { damen: [71, 163], herren: [77, 192] },
      "2a": { damen: [122, 189], herren: [136, 230] },
      "2b": { damen: [72, 145], herren: [77, 182] },
      "3a": { damen: [105, 163], herren: [118, 198] },
      "3b": { damen: [83, 131], herren: [92, 153] }
    };

    const FORMELN = {
      "1a": {
        damen: d => (d - 10) / 7.1,
        herren: d => (d - 9) / 8.9,
        mixed: (d, F, M) => ((F*(d-10)/7.1)+(M*(d-9)/8.9))/(F+M)
      },
      "1b": {
        damen: d => (d + 21) / 18.4,
        herren: d => (d + 38) / 23,
        mixed: (d, F, M) => ((F*(d+21)/18.4)+(M*(d+38)/23))/(F+M)
      },
      "2a": {
        damen: d => (d - 55) / 13.4,
        herren: d => (d - 42) / 18.8,
        mixed: (d, F, M) => ((F*(d-55)/13.4)+(M*(d-42)/18.8))/(F+M)
      },
      "2b": {
        damen: d => (d + 1) / 14.6,
        herren: d => (d + 28) / 21,
        mixed: (d, F, M) => ((F*(d+1)/14.6)+(M*(d+28)/21))/(F+M)
      },
      "3a": {
        damen: d => (d - 47) / 11.6,
        herren: d => (d - 37) / 16.1,
        mixed: (d, F, M) => ((F*(d-47)/11.6)+(M*(d-37)/16.1))/(F+M)
      },
      "3b": {
        damen: d => (d - 34) / 9.7,
        herren: d => (d - 31) / 12.2,
        mixed: (d, F, M) => ((F*(d-34)/9.7)+(M*(d-31)/12.2))/(F+M)
      }
    };

    function liveCheck() {
      const dis = document.getElementById('disziplin').value;
      const F = parseInt(document.getElementById('anzTi').value || 0);
      const M = parseInt(document.getElementById('anzTu').value || 0);
      const total = F + M;
      const max = MAX_TEILNEHMER[dis];
      const min = MIN_TEILNEHMER[dis];

      if (aktiveKategorie !== "mixed") {
        document.getElementById("errorMsg").textContent = "";
        return true;
      }

      if (total > max) {
        document.getElementById("errorMsg").textContent = `Maximal erlaubt: ${max} Personen`;
        return false;
      }

      if (total < min) {
        document.getElementById("errorMsg").textContent = `Mindestens ${min} Personen erfassen`;
        return false;
      }

      document.getElementById("errorMsg").textContent = "";
      return true;
    }

    document.getElementById('anzTi').addEventListener('input', () => {
      liveCheck();
      generiereTabelle();
    });

    document.getElementById('anzTu').addEventListener('input', () => {
      liveCheck();
      generiereTabelle();
    });

    document.getElementById('disziplin').addEventListener('change', () => {
      document.getElementById("errorMsg").textContent = "";
      generiereTabelle();
    });

    function berechneNote() {
      const dis = document.getElementById('disziplin').value;
      const d = parseFloat(document.getElementById('punkte').value);
      const output = document.getElementById('output');

      if (aktiveKategorie === "mixed") {
        const F = parseInt(document.getElementById('anzTi').value || 0);
        const M = parseInt(document.getElementById('anzTu').value || 0);
        const total = F + M;
        const min = MIN_TEILNEHMER[dis];

        if (total < min) {
          output.textContent = `Note: Mindestens ${min} Personen erfassen`;
          return;
        }

        if (!liveCheck()) {
          output.textContent = "Note: –";
          return;
        }
      }

      let note;

      if (aktiveKategorie === "damen") {
        note = FORMELN[dis].damen(d);
      } else if (aktiveKategorie === "herren") {
        note = FORMELN[dis].herren(d);
      } else {
        const F = parseInt(document.getElementById('anzTi').value || 0);
        const M = parseInt(document.getElementById('anzTu').value || 0);
        note = FORMELN[dis].mixed(d, F, M);
      }

      output.textContent = `Note: ${(Math.round(note * 100) / 100).toFixed(2)}`;
    }

    function generiereTabelle() {
      const dis = document.getElementById('disziplin').value;
      const tableContainer = document.getElementById('tableContainer');

      let F = 0, M = 0;
      let minP, maxP;

      if (aktiveKategorie === "damen") {
        minP = PUNKTEBEREICHE[dis].damen[0];
        maxP = PUNKTEBEREICHE[dis].damen[1];
      } else
